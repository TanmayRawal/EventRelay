services:
  postgres:
    image: postgres:16-alpine
    container_name: eventrelay-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eventrelay_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventrelay} -d ${POSTGRES_DB:-eventrelay_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventrelay-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventrelay-backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-eventrelay}:${POSTGRES_PASSWORD:-postgres_password_dev}@postgres:5432/${POSTGRES_DB:-eventrelay_db}
      REDIS_URL: redis://redis:6379
      EVENTRELAY_API_KEY: ${EVENTRELAY_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      INGESTION_RATE_LIMIT_RPS: ${INGESTION_RATE_LIMIT_RPS:-1000}
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${EVENTRELAY_API_KEY:-}
    container_name: eventrelay-frontend
    restart: always
    environment:
      VITE_API_KEY: ${EVENTRELAY_API_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

  mock-receiver:
    build:
      context: ./mock-receiver
      dockerfile: Dockerfile
    container_name: eventrelay-mock-receiver
    restart: always
    environment:
      PORT: 9000
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  redis_data:
