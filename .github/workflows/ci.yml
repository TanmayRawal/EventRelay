name: EventRelay CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventrelay
          POSTGRES_PASSWORD: eventrelay_secret
          POSTGRES_DB: eventrelay_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'projects/eventrelay/backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./projects/eventrelay/backend
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./projects/eventrelay/backend
        run: npm test

      - name: Build TypeScript Project
        working-directory: ./projects/eventrelay/backend
        run: npm run build

      - name: Validate Docker Build
        working-directory: ./projects/eventrelay
        run: docker compose build
